services:
  pages-between:
    build: .
    container_name: pages-between
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      APP_PASSWORD: "${APP_PASSWORD:?Please set APP_PASSWORD in .env (minimum 12 characters)}"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_WORKERS: ${MAX_WORKERS:-12}
      CONFIG_DIR: /config
    volumes:
      - ./config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
